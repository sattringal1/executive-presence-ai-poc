name: Deploy React App to GitHub Pages

on:
  push:
    branches: ["main", "executive-presence-ai-poc"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: cd exec-presence-ai && npm ci

      - name: Build project
        run: cd exec-presence-ai && npm run build

      # ← new verification step
      - name: Final verification
        run: |
          cd exec-presence-ai
          echo "✅ FINAL VERIFICATION CHECKLIST"
          echo
          echo "1. Git Working Tree:"
          git status --short
          num_files=$(git status --short | wc -l)
          echo "   Status: $num_files files to commit (0 = clean)"
          echo
          echo "2. Latest Commits:"
          git log --oneline -2
          echo
          echo "3. Remote Sync:"
          git fetch --all --quiet
          git status -uno
          echo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './exec-presence-ai/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4